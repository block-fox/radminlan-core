name: Core compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: runner.os != 'Windows'
        run: ./gradlew build --no-daemon
      - if: runner.os == 'Windows'
        run: .\gradlew.bat build --no-daemon
      - run: java -jar build/libs/radminlan-core-0.1.0.jar --help
      - if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 platform/linux/tun.c -o build/radminlan-tun
          sudo unshare --net python3 platform/tun-smoke.py build/radminlan-tun
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: radminlan-tun-linux-x64
          path: build/radminlan-tun
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 platform/macos/utun.c -o build/radminlan-utun
          sudo python3 platform/tun-smoke.py build/radminlan-utun
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: radminlan-utun-macos
          path: build/radminlan-utun
          if-no-files-found: error
      - if: runner.os == 'Windows'
        run: |
          ./platform/windows/build.ps1
          python platform/tun-smoke.py build/wintun-native/radminlan-wintun.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: radminlan-wintun-windows-x64
          path: build/wintun-native/radminlan-wintun.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - working-directory: android
        run: ./scripts/setup-android-sdk.sh
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: radminlan-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Verify the VPN service on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon
