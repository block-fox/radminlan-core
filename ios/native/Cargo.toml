[package]
name = "radminlan-apple"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["staticlib"]

[dependencies]
aes = "0.8.4"
anyhow = "1"
directories = "6"
hex = "0.4"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
md4 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
subtle = "2"
zeroize = "1"
