name: RadminLAN
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    RADMINLAN_BUNDLE_ID: dev.radminlan.ios
    CODE_SIGN_STYLE: Automatic
targets:
  RadminLAN:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - sdk: NetworkExtension.framework
      - target: PacketTunnel
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RadminLAN
        PRODUCT_BUNDLE_IDENTIFIER: $(RADMINLAN_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: RadminLAN.entitlements
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: [Info.plist, Bridge.h]
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    info:
      path: PacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RADMINLAN_BUNDLE_ID).PacketTunnel
        CODE_SIGN_ENTITLEMENTS: RadminLAN.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/Bridge.h
        OTHER_LDFLAGS: [$(inherited), $(SRCROOT)/native/build/libradminlan_apple.a]
